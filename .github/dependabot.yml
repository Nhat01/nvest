version: 2

updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Spring Boot và các starter đi cùng nhau, gộp vào một PR để tránh lệch version.
      spring:
        patterns:
          - "org.springframework*"
      test:
        patterns:
          - "org.testcontainers*"
          - "org.junit*"
          - "org.assertj*"
          - "org.mockito*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
