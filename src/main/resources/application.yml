server:
  # Nhiều nền tảng PaaS (Render, Cloud Run...) truyền cổng qua biến PORT.
  # Chạy local hoặc Docker không set PORT thì dùng 8080.
  port: ${PORT:8080}
  tomcat:
    # Render free chỉ 0.1 CPU/512MB: giữ ít thread để giảm stack và buffer.
    threads:
      max: ${SERVER_TOMCAT_THREADS_MAX:25}
      min-spare: ${SERVER_TOMCAT_THREADS_MIN_SPARE:5}
    max-connections: ${SERVER_TOMCAT_MAX_CONNECTIONS:200}
    accept-count: ${SERVER_TOMCAT_ACCEPT_COUNT:50}

spring:
  application:
    name: savings-platform
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/savings}
    username: ${SPRING_DATASOURCE_USERNAME:savings}
    password: ${SPRING_DATASOURCE_PASSWORD:savings}
    hikari:
      # Render free 512MB: pool nhỏ để giảm connection + buffer trong app.
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAX_POOL_SIZE:5}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MIN_IDLE:1}
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:300000}
      max-lifetime: ${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:600000}
      keepalive-time: ${SPRING_DATASOURCE_HIKARI_KEEPALIVE_TIME:60000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mail:
    # Local: Mailpit ở localhost:1025. Gmail: host smtp.gmail.com, port 587,
    # SPRING_MAIL_SMTP_AUTH=true, SPRING_MAIL_SMTP_STARTTLS=true.
    # Không đặt username/password mặc định ở đây: chỉ nhận từ biến môi trường.
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${SPRING_MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SPRING_MAIL_SMTP_STARTTLS:false}
      mail.smtp.starttls.required: ${SPRING_MAIL_SMTP_STARTTLS:false}
      # Không có timeout thì SMTP treo sẽ làm treo luôn luồng Kafka listener.
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  http:
    client:
      # Timeout cho RestClient (Brevo). Không có timeout thì HTTP treo sẽ
      # treo luôn luồng Kafka listener.
      connect-timeout: 5s
      read-timeout: 10s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 30000
        request.timeout.ms: 10000
        max.block.ms: 5000
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 50
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        max.poll.interval.ms: 300000
    listener:
      ack-mode: record

# Tài liệu OpenAPI/Swagger. Đặt NVEST_OPENAPI_ENABLED=false khi deploy thật
# để không công khai danh sách endpoint.
springdoc:
  api-docs:
    enabled: ${NVEST_OPENAPI_ENABLED:true}
  swagger-ui:
    enabled: ${NVEST_OPENAPI_ENABLED:true}

# Thêm spring-boot-starter-mail sẽ tự bật health check SMTP. Dev dùng logging
# sender, không có SMTP ở localhost:1025, nên health sẽ DOWN và /actuator/health
# trả 503. Chỉ bật lại khi thật sự muốn kiểm tra kết nối SMTP.
management:
  health:
    mail:
      enabled: ${NVEST_MAIL_HEALTH_ENABLED:false}

nvest:
  kafka:
    enabled: ${NVEST_KAFKA_ENABLED:true}
    # 1 consumer/topic là đủ với lượng event nhỏ; giảm memory và CPU trên free tier.
    listener:
      concurrency: ${NVEST_KAFKA_LISTENER_CONCURRENCY:1}
    ssl:
      ca-cert: ${NVEST_KAFKA_SSL_CA_CERT:}
      client-cert: ${NVEST_KAFKA_SSL_CLIENT_CERT:}
      client-key: ${NVEST_KAFKA_SSL_CLIENT_KEY:}
      key-password: ${NVEST_KAFKA_SSL_KEY_PASSWORD:}
      endpoint-identification-algorithm: ${NVEST_KAFKA_SSL_ENDPOINT_ID_ALGO:https}
  outbox:
    relay:
      batch-size: 100
      delay: PT1S
      send-timeout-ms: 5000
  payment:
    provider: ${NVEST_PAYMENT_PROVIDER:mock}
    mock:
      secret: ${NVEST_MOCK_WEBHOOK_SECRET:dev-mock-secret-change-me}
      checkout-base-url: ${NVEST_CHECKOUT_BASE_URL:http://localhost:3000}
    vnpay:
      tmn-code: ${VNPAY_TMN_CODE:}
      hash-secret: ${VNPAY_HASH_SECRET:}
      return-url: ${NVEST_VNPAY_RETURN_URL:http://localhost:3000/payment/result}
  mail:
    enabled: ${NVEST_MAIL_ENABLED:false}
    # smtp: JavaMail (Mailpit/Gmail khi chạy local, hoặc server trả tiền).
    # brevo: HTTP API qua port 443, dùng được trên Render free vì Render
    # chặn outbound port 25/465/587.
    provider: ${NVEST_MAIL_PROVIDER:smtp}
    from: ${NVEST_MAIL_FROM:no-reply@nvest.local}
    from-name: ${NVEST_MAIL_FROM_NAME:Nvest Savings}
    verification-link: ${NVEST_VERIFICATION_LINK:http://localhost:3000/verify-email?token=}
    reset-link: ${NVEST_RESET_LINK:http://localhost:3000/reset-password?token=}
    brevo:
      api-key: ${BREVO_API_KEY:}
      base-url: ${BREVO_BASE_URL:https://api.brevo.com}
  auth:
    email-token:
      # P24H không hợp lệ; ISO-8601 cho 24 giờ là PT24H.
      verification-ttl: ${NVEST_EMAIL_VERIFICATION_TTL:PT24H}
      reset-ttl: ${NVEST_PASSWORD_RESET_TTL:PT30M}
      cooldown: ${NVEST_EMAIL_TOKEN_COOLDOWN:PT60S}
  cors:
    # Origin frontend, cách nhau bởi dấu phẩy. Mặc định là hai origin dev phổ biến;
    # set rỗng để chặn hết, hoặc đổi sang domain thật khi deploy.
    allowed-origins: ${NVEST_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  checkout:
    base-url: ${NVEST_CHECKOUT_BASE_URL:http://localhost:8080}
  security:
    jwt:
      secret: ${NVEST_JWT_SECRET:dev-only-secret-change-me-in-production-32b}
      ttl: ${NVEST_JWT_TTL:PT1H}
      # Chỉ đặt true khi chạy local. Không set biến này mà dùng secret mặc định
      # thì app từ chối khởi động.
      allow-dev-secret: ${NVEST_ALLOW_DEV_JWT_SECRET:false}
    login-rate-limit:
      # Đếm số lần đăng nhập sai theo cặp (IP, email). Sai quá max-failures
      # trong khoảng window thì trả 429 cho tới khi cửa sổ trôi qua.
      enabled: ${NVEST_LOGIN_RATE_LIMIT_ENABLED:true}
      max-failures: ${NVEST_LOGIN_RATE_LIMIT_MAX_FAILURES:5}
      window: ${NVEST_LOGIN_RATE_LIMIT_WINDOW:PT15M}
    refresh-token:
      ttl: ${NVEST_REFRESH_TOKEN_TTL:P30D}