spring:
  application:
    name: savings-platform
  datasource:
    url: jdbc:postgresql://localhost:5432/savings
    username: savings
    password: savings
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

nvest:
  payment:
    provider: ${NVEST_PAYMENT_PROVIDER:mock}
    mock:
      secret: ${NVEST_MOCK_WEBHOOK_SECRET:dev-mock-secret-change-me}
    vnpay:
      tmn-code: ${VNPAY_TMN_CODE:}
      hash-secret: ${VNPAY_HASH_SECRET:}
      return-url: ${NVEST_VNPAY_RETURN_URL:http://localhost:3000/payment/result}
  security:
    jwt:
      secret: ${NVEST_JWT_SECRET:dev-only-secret-change-me-in-production-32b}
      ttl: PT1H