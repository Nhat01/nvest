spring:
  application:
    name: savings-platform
  datasource:
    url: jdbc:postgresql://localhost:5432/savings
    username: savings
    password: savings
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

nvest:
  payment:
    provider: mock
    mock:
      secret: dev-mock-secret-change-me
  security:
    jwt:
      secret: ${NVEST_JWT_SECRET:dev-only-secret-change-me-in-production-32b}
      ttl: PT1H