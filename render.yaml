# Render Blueprint specification
# https://render.com/docs/blueprint-spec
version: "1"

services:
  - type: web
    name: savings-platform
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: free
    healthCheckPath: /actuator/health
    autoDeploy: true

    envVars:
      # Database: Neon PostgreSQL
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false

      # Bảo mật: JWT Secret tự sinh ngẫu nhiên ≥ 32 bytes
      - key: NVEST_JWT_SECRET
        generateValue: true
      - key: NVEST_ALLOW_DEV_JWT_SECRET
        value: "false"

      # Event Streaming: Aiven Kafka
      - key: NVEST_KAFKA_ENABLED
        value: "true"
      - key: KAFKA_BOOTSTRAP_SERVERS
        sync: false
      - key: NVEST_KAFKA_SSL_CA_CERT
        sync: false
      - key: NVEST_KAFKA_SSL_CLIENT_CERT
        sync: false
      - key: NVEST_KAFKA_SSL_CLIENT_KEY
        sync: false
      - key: NVEST_KAFKA_LISTENER_CONCURRENCY
        value: "1"

      # Cổng thanh toán (mock hoặc vnpay)
      - key: NVEST_PAYMENT_PROVIDER
        value: mock
      - key: NVEST_CHECKOUT_BASE_URL
        sync: false

      # Tối ưu bộ nhớ cho Render Free Tier (512MB RAM)
      - key: JAVA_OPTS
        value: "-XX:MaxRAMPercentage=60 -XX:InitialRAMPercentage=20 -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError"

      # Tắt tài liệu Swagger trên Production để bảo mật
      - key: NVEST_OPENAPI_ENABLED
        value: "false"

      # CORS domain frontend (ví dụ: https://your-frontend.vercel.app)
      - key: NVEST_CORS_ALLOWED_ORIGINS
        sync: false

      # Email. Đổi NVEST_MAIL_ENABLED thành "true" sau khi đã test gửi mail ở local.
      # SPRING_MAIL_USERNAME/PASSWORD là secret: nhập trong dashboard (sync: false).
      # Gmail: bật 2FA, tạo App Password; dùng port 587 + auth + STARTTLS.
      - key: NVEST_MAIL_ENABLED
        value: "false"
      - key: NVEST_MAIL_FROM
        sync: false
      - key: SPRING_MAIL_HOST
        value: "smtp.gmail.com"
      - key: SPRING_MAIL_PORT
        value: "587"
      - key: SPRING_MAIL_USERNAME
        sync: false
      - key: SPRING_MAIL_PASSWORD
        sync: false
      - key: SPRING_MAIL_SMTP_AUTH
        value: "true"
      - key: SPRING_MAIL_SMTP_STARTTLS
        value: "true"
      # Giữ false: healthCheckPath của Render là /actuator/health, SMTP lỗi
      # sẽ làm service bị đánh unhealthy và restart.
      - key: NVEST_MAIL_HEALTH_ENABLED
        value: "false"
